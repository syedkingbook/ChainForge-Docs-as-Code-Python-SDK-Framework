[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chainforge-sdk"
version = "1.0.0"
description = "Official sample Python SDK for ChainForge Developer Platform"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25.0",
]

[tool.setuptools]
packages = ["chainforge"]